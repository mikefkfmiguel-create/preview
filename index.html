<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview — Mike Apps</title>
<meta name="theme-color" content="#0E1418">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<aside id="painel">
  <header>
    <img src="icons/mike-logo.png" alt="Mike Apps" id="marca">
    <div>
      <b>Preview</b>
      <span>o projeto no terreno</span>
    </div>
    <button id="btFechar" title="Esconder o painel (Tab)">‹</button>
  </header>

  <section>
    <h2>Projeto</h2>
    <div id="resumo" class="vazio">Sem projeto. Cola aqui o que vem dos Calculadores.</div>
    <textarea id="colagem" rows="3" placeholder='{"v":1,"zonas":[…]}  — ou o texto que os Calculadores copiam'></textarea>
    <div class="botoes">
      <button id="btCarregar" class="primario">Carregar</button>
      <button id="btExemplo">Exemplo</button>
    </div>
  </section>

  <section>
    <h2>Sala</h2>
    <div class="campos">
      <label>Largura <input id="salaL" type="number" value="20" min="2" max="200" step="0.5"><i>m</i></label>
      <label>Profundidade <input id="salaP" type="number" value="14" min="2" max="300" step="0.5"><i>m</i></label>
      <label>Pé-direito <input id="salaA" type="number" value="7" min="2" max="60" step="0.5"><i>m</i></label>
    </div>
  </section>

  <section>
    <h2>Palco</h2>
    <div class="campos">
      <label>Largura <input id="palcoL" type="number" value="12" min="1" max="200" step="0.5"><i>m</i></label>
      <label>Altura <input id="palcoA" type="number" value="1" min="0" max="10" step="0.1"><i>m</i></label>
      <label>Profundidade <input id="palcoP" type="number" value="6" min="0" max="60" step="0.5"><i>m</i></label>
      <label>Ecrã acima do palco <input id="ecraOffset" type="number" value="0" min="0" max="20" step="0.1"><i>m</i></label>
    </div>
  </section>

  <section>
    <h2>Público</h2>
    <div class="vistas" id="tipoPlateia">
      <button data-plateia="pavilhao">Pavilhão · plano</button>
      <button data-plateia="auditorio">Auditório · sobe</button>
    </div>
    <div class="campos" style="margin-top:10px">
      <label>Filas <input id="filas" type="number" value="12" min="0" max="80" step="1"><i></i></label>
      <label>Primeira fila a <input id="primeiraFila" type="number" value="3" min="0" max="40" step="0.5"><i>m</i></label>
      <label>Entre filas <input id="entreFilas" type="number" value="0.9" min="0.5" max="3" step="0.05"><i>m</i></label>
      <label>Entre lugares <input id="entreLugares" type="number" value="0.55" min="0.4" max="2" step="0.05"><i>m</i></label>
      <label>Corredores <input id="corredores" type="number" value="1" min="0" max="4" step="1"><i></i></label>
      <label>Largura deles <input id="larguraCorredor" type="number" value="1.2" min="0.6" max="4" step="0.1"><i>m</i></label>
      <label>Sobe por fila <input id="inclinacao" type="number" value="0.12" min="0" max="0.6" step="0.01"><i>m</i></label>
    </div>
    <label class="opcao"><input id="sentado" type="checkbox" checked> Sentado</label>
  </section>

  <section>
    <h2>Projeção</h2>
    <label class="opcao" style="margin:0 0 12px"><input id="projLigada" type="checkbox"> Mostrar projeção</label>
    <div class="campos">
      <label>Rácio (throw) <input id="projRacio" type="number" value="1.4" min="0.3" max="10" step="0.1"><i>:1</i></label>
      <label>Distância à tela <input id="projDist" type="number" value="12" min="1" max="120" step="0.5"><i>m</i></label>
      <label>Altura da lente <input id="projAltura" type="number" value="4.5" min="0.2" max="30" step="0.1"><i>m</i></label>
      <label>Base da imagem <input id="projBase" type="number" value="1" min="0" max="20" step="0.1"><i>m</i></label>
    </div>
    <div class="vistas" style="margin-top:10px">
      <button data-formato="1.777">16:9</button>
      <button data-formato="1.6">16:10</button>
    </div>
    <div id="resumoProj" class="vazio" style="margin-top:10px">—</div>
  </section>

  <section>
    <h2>Conteúdo nos ecrãs</h2>
    <div class="vistas">
      <button id="btPadrao">Padrão de teste</button>
      <button id="btImagem">Imagem…</button>
    </div>
    <button id="btSemConteudo" style="margin-top:8px; width:100%">Só cor</button>
    <div class="vistas" style="margin-top:8px">
      <button data-conteudo="espalhado" class="destaque">Espalhada</button>
      <button data-conteudo="cada">Uma em cada</button>
    </div>
    <input type="file" id="ficheiroImagem" accept="image/*" hidden>
    <p class="vazio" style="margin:10px 0 0" id="notaConteudo">Espalhada: uma imagem só
       pelo conjunto todo, cada zona mostra o seu bocado — como o media server faz.</p>
  </section>

  <section>
    <h2>Vista</h2>
    <div class="vistas">
      <button data-vista="frente">Frente</button>
      <button data-vista="lado">Lado</button>
      <button data-vista="cima">Cima</button>
      <button data-vista="olhos" class="destaque">Olhos da plateia</button>
    </div>
    <label class="opcao"><input id="verMedidas" type="checkbox" checked> Medidas e grelha</label>
    <button id="btGuardarImagem" style="margin-top:10px; width:100%">Guardar imagem (PNG)</button>
  </section>

  <section id="zonas">
    <h2>Zonas</h2>
    <div id="listaZonas" class="vazio">—</div>
  </section>

  <footer id="rodape"></footer>

  <section id="cauda">
    <button id="btInstalar" hidden>Instalar esta app</button>
    <p id="comoInstalar" class="vazio" hidden></p>
    <a class="ligacao" href="https://mikefkfmiguel-create.github.io/calculadores/"
       target="_blank" rel="noopener">↗ Calculadores</a>
  </section>
</aside>

<main>
  <button id="btAbrir" title="Mostrar o painel (Tab)">☰</button>
  <canvas id="tela"></canvas>
  <div id="etiquetas"></div>
  <div id="aviso"></div>
</main>

<!-- O Three.js vive dentro do repositório, e não num CDN: isto usa-se em salas e
     pavilhões, e uma app 3D que precisa de internet falha no sítio onde faz falta. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="js/app.js"></script>

<script>
  // Instalável e capaz de abrir sem rede. O registo é sempre relativo, porque
  // isto vive numa subpasta no GitHub Pages e um caminho absoluto punha o
  // service worker a mandar na raiz do domínio inteiro.
  if ("serviceWorker" in navigator) {
    addEventListener("load", async () => {
      try {
        const registo = await navigator.serviceWorker.register("./sw.js");
        // Quando entra uma versao nova, ela so manda no proximo arranque. Em
        // vez de deixar o mike a olhar para a app de ontem sem saber porque,
        // recarrega-se assim que ela estiver pronta.
        registo.addEventListener("updatefound", () => {
          const novo = registo.installing;
          if (!novo) return;
          novo.addEventListener("statechange", () => {
            if (novo.state === "installed" && navigator.serviceWorker.controller) location.reload();
          });
        });
      } catch (_) { /* sem service worker a app funciona na mesma, so nao offline */ }
    });
  }
</script>
</body>
</html>
